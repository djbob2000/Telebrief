settings:
  schedule_time: "09:00"
  timezone: "Europe/Kyiv"
  lookback_hours: 24

  edition_scopes:
    berdyansk:
      name: "Бердянск"
      focus_places:
        - "Бердянск"
        - "Бердянский район"
        - "Осипенко"
        - "Нововасилевка"
        - "Азовское"
        - "Дмитровка"
        - "Трояны"
        - "Андровка"
        - "Берестовое"
      direct_impact_only: true
      notes:
        - "Фразы о Бердянском или Запорожском направлении фронта не означают событие в городе или районе."
        - "Событие вне фокусной зоны допускается только при явно описанном практическом последствии для жителей, услуг, инфраструктуры, маршрутов или доступа в фокусной зоне."

  # OpenRouter provider settings:
  ai_provider: "openrouter"

  ai_model: "minimax/minimax-m3:free"
  max_tokens_per_summary: 65536

  digest_mode: "digest"
  dedup_topics: true
  digest_rubrics:
    min_similarity: 0.38
    items:
      - id: infrastructure
        name: "Инфраструктура и ЖКХ"
        description: "Электричество, вода, газ, тепло, аварии и городские инженерные сети"
        emoji: "⚡️"

      - id: safety
        name: "Безопасность"
        description: "Пожары, аварии, угрозы, чрезвычайные происшествия и риски для жителей"
        emoji: "💥"

      - id: mobility
        name: "Транспорт"
        description: "Автобусы, маршруты, дороги, перекрытия и транспортная доступность"
        emoji: "🚌"

      - id: communications
        name: "Связь"
        description: "Мобильная связь, интернет, операторы и доступность коммуникаций"
        emoji: "📶"

      - id: health
        name: "Здоровье"
        description: "Больницы, поликлиники, аптеки, медицинская помощь и здоровье жителей"
        emoji: "🏥"

      - id: civic_services
        name: "Городские службы"
        description: "Документы, административные услуги, банки, почта и доступ к городским сервисам"
        emoji: "🏛"

      - id: education_culture
        name: "Образование и культура"
        description: "Школы, обучение, культурные учреждения и общественные мероприятия"
        emoji: "🎓"

      - id: society
        name: "Общество"
        description: "Социальная помощь, выплаты, волонтёрство и повседневные вопросы жителей"
        emoji: "🤝"

      - id: environment
        name: "Погода и экология"
        description: "Погода, море, экологические события и природные условия"
        emoji: "🌦"

      - id: economy
        name: "Экономика"
        description: "Цены, торговля, банки, наличные, работа предприятий и локальная экономика"
        emoji: "💼"

      - id: other
        name: "Другое"
        description: "Важные локальные события, которые не подходят к другим рубрикам"
        emoji: "📌"
        fallback: true

  digest_groups:

    - name: "В фокусе внимания"
      description: "Главные локальные события с наибольшей подтвержденной практической значимостью или прямым риском для жителей: взрывы и сообщения о воздушных целях, чрезвычайные ситуации, крупные аварии ЖКХ и ключевые общегородские происшествия. Резонанс или массовость учитывай только если они прямо подтверждаются входными данными. Не выводить группу, если подходящих пунктов нет."
    - name: "Коммунальная обстановка"
      description: "Свет, вода, газ, отопление, аварии сетей, ремонты, графики отключений и состояние коммунальной инфраструктуры Бердянска и Бердянского района."
    - name: "Безопасность и чрезвычайные ситуации"
      description: "Подтверждённые обстрелы, БПЛА/ПВО, взрывы, пожары, аварийные инциденты, предупреждения о мошенничестве и прямые риски для жителей Бердянска и Бердянского района."
    - name: "Связь и интернет"
      description: "Мобильная связь, интернет-провайдеры, работа вышек, сбои, аварии и восстановление телеком-инфраструктуры в Бердянске и районе."
    - name: "Транспорт и дороги"
      description: "Маршруты общественного транспорта, расписания, состояние и перекрытия дорог, пригородные перевозки Бердянска и Бердянского района. Строго без рекламы частных перевозчиков и такси."
    - name: "Медицина и здоровье"
      description: "Работа больниц, поликлиник, аптек, прием врачей, наличие медикаментов, вакцинация и важная медицинская информация для населения Бердянска и района."
    - name: "Социальная помощь"
      description: "Выплаты, пенсии, пособия, льготы, гуманитарная помощь, центры поддержки и социальные программы для жителей Бердянска и района."
    - name: "Полезные контакты"
      description: "Официальные горячие линии, проверенные службы экстренной помощи, аварийные контакты и графики приема госорганов Бердянска. Без частных объявлений."
    - name: "Другое"
      description: "Важные локальные новости Бердянска и Бердянского района, не вошедшие в другие категории. Исключать новости других регионов, геополитику и рекламу. Не выводить группу, если подходящих пунктов нет."

