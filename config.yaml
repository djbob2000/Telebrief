channels:
  - id: "@berdiansk_me"
    name: "Бердянск"
    source_type: community
    prompt_extra: &regional_prompt |
      ДОПОЛНИТЕЛЬНЫЙ РЕГИОНАЛЬНЫЙ КОНТРАКТ

      ГЕОГРАФИЧЕСКИЙ ФОКУС
      - Основная зона: Бердянск и Бердянский район (прилегающие населённые пункты).
      - Событие за пределами этой зоны включай только при наличии прямого, конкретного последствия для местных жителей. Само упоминание региона или известного местного лица недостаточно.
      - Если локальная связь не установлена входными сообщениями, не додумывай её и исключи событие, даже если оно важно на национальном или международном уровне.

      ВЫСОКИЙ ПРИОРИТЕТ
      1. Непосредственная безопасность: взрывы, обстрелы, БПЛА/ПВО, пожары, аварии, чрезвычайные ситуации, опасные находки и подтверждённые схемы мошенничества.
      2. ЖКХ и инфраструктура: электричество, вода, газ, отопление, связь, интернет, аварии, ремонты, графики отключений и состояние дорог.
      3. Практические изменения для жителей: транспорт, перекрытия, медицина, аптеки, образование, гуманитарная помощь, пенсии, выплаты, льготы, документы и правила доступа к услугам.
      4. Официальные решения и изменения, которые уже создают конкретные местные последствия: сроки, суммы, адреса, ограничения, обязанности или доступность услуг.
      5. Проверенные телефоны, адреса и графики работы официальных аварийных, коммунальных, медицинских и социальных служб.

      В ФОКУСЕ ВНИМАНИЯ (РЕЗОНАНСНЫЕ ТЕМЫ)
      - Выделяй событие как резонансное только если это следует из входных данных: есть несколько независимых сообщений, явные признаки широкого обсуждения или подтвержденная прямая угроза безопасности. Не называй событие «массовым», «масштабным» или «кризисом» только из-за важности темы.
      - Длина описания определяется подтвержденной фактурой. Одно-два содержательных предложения допустимы; не дополняй событие фоном, причинами, техническими механизмами или последствиями ради объема.
      - Хронологию указывай только по времени, прямо присутствующему во входных сообщениях. Последовательность событий не превращай в причинно-следственную связь.
      - Перечисляй только те районы, адреса и объекты, которые прямо названы в источниках в связи с конкретным наблюдением или событием. Не расширяй список до «большинства города».
      - Не делай вывод «официальных комментариев нет» только потому, что их нет в текущей выборке сообщений. Такую формулировку используй лишь когда отсутствие комментария прямо установлено редакцией или источником.
      - Сохраняй спокойный, фактологический тон и точную атрибуцию («по сообщениям жителей», «по данным [источника]», «предварительно») без паники и неподтвержденных домыслов.

      EVENT-BASED ОБЪЕДИНЕНИЕ
      - Несколько сообщений об одном происшествии, отключении, решении или восстановлении объединяй в одно событие с актуальным статусом.
      - Дополняй событие подтверждёнными деталями и хронологией, но не повторяй одинаковые факты.
      - Не объединяй разные случаи только из-за общей темы. Разные даты, места, причины, решения или последствия означают разные события.
      - Если новое сообщение меняет статус того же события, используй наиболее свежий статус и сохрани важную хронологию.

      СТРОГИЙ ФИЛЬТР
      - Исключай общенациональные, российские и международные новости без прямого локального последствия.
      - Исключай политические заявления, внешнюю военную помощь и общие экономические новости, если во входных данных нет конкретного влияния на жителей указанной зоны.
      - Исключай рекламу, коммерческие предложения, частные объявления, аренду, куплю/продажу, перевозки и такси, объявления о животных, флуд, приветствия и чат-администрирование.
      - Исключай эмоциональные оценки, панику, пропагандистские формулы, неподкреплённые выводы и повторы без новой фактической информации.

      ДОСТОВЕРНОСТЬ И ИСТОЧНИКИ
      - Не выдавай сообщения жителей, заявления сторон или слухи за подтверждённый факт.
      - Конкретное и значимое неподтверждённое местное сообщение можно включить только с явной атрибуцией: «по сообщениям жителей», «предварительно», «заявляет [источник]» или «официального подтверждения нет».
      - Не исключай полезное местное наблюдение только потому, что оно поступило из одного источника: для обычных бытовых, коммунальных и сервисных тем лучше аккуратная атрибуция, чем отсутствие информации.
      - При расхождении данных кратко укажи различие и не выбирай версию без основания во входных сообщениях.
      - Для каждого уникального события используй наиболее прямую и информативную точную ссылку на исходное сообщение, если она доступна. Дополнительную ссылку добавляй только для существенной отдельной детали или расхождения.

