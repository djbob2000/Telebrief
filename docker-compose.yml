services:
  telebrief-migrate:
    image: telebrief:${IMAGE_TAG:-dev}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${TELEBRIEF_ENV_FILE:-.env}
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=UTC
      - DATABASE_URL=postgresql://${POSTGRES_USER:-telebrief}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-telebrief}
      - DATABASE_MAX_POOL_SIZE=10
      - DATABASE_MIN_POOL_SIZE=1
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    command: ["python", "scripts/migrate.py"]

  telebrief-app:
    image: telebrief:${IMAGE_TAG:-dev}
    # Coolify builds this shared image once; migration and workers use the same tag.
    build: .
    container_name: telebrief-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      telebrief-migrate:
        condition: service_completed_successfully
    env_file:
      - ${TELEBRIEF_ENV_FILE:-.env}
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=UTC
      - DATABASE_URL=postgresql://${POSTGRES_USER:-telebrief}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-telebrief}
      - DATABASE_MAX_POOL_SIZE=10
      - DATABASE_MIN_POOL_SIZE=1
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./logs:/app/logs
      - ./sessions:/app/sessions
      - ./data:/app/data
      - telebrief_auth:/var/lib/telebrief/auth
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import os, signal; os.kill(1, 0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  telebrief-worker:
    image: telebrief:${IMAGE_TAG:-dev}
    container_name: telebrief-worker
    restart: unless-stopped
    stop_grace_period: 120s
    command: ["python", "-m", "src.worker", "--concurrency=2", "--queues=publication,maintenance"]
    depends_on:
      postgres:
        condition: service_healthy
      telebrief-migrate:
        condition: service_completed_successfully
    env_file:
      - ${TELEBRIEF_ENV_FILE:-.env}
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=UTC
      - DATABASE_URL=postgresql://${POSTGRES_USER:-telebrief}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-telebrief}
      - DATABASE_MAX_POOL_SIZE=10
      - DATABASE_MIN_POOL_SIZE=1
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./logs:/app/logs
      - ./sessions:/app/sessions
      - ./data:/app/data
      - telebrief_auth:/var/lib/telebrief/auth
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  telebrief-processing-worker:
    image: telebrief:${IMAGE_TAG:-dev}
    container_name: telebrief-processing-worker
    restart: unless-stopped
    stop_grace_period: 120s
    command: ["python", "-m", "src.worker", "--concurrency=1", "--queues=processing,collection,enrichment,default"]
    depends_on:
      postgres:
        condition: service_healthy
      telebrief-migrate:
        condition: service_completed_successfully
    env_file:
      - ${TELEBRIEF_ENV_FILE:-.env}
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=UTC
      - DATABASE_URL=postgresql://${POSTGRES_USER:-telebrief}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-telebrief}
      - DATABASE_MAX_POOL_SIZE=10
      - DATABASE_MIN_POOL_SIZE=1
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./logs:/app/logs
      - ./sessions:/app/sessions
      - ./data:/app/data
      - telebrief_auth:/var/lib/telebrief/auth
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  telebrief-authority-worker:
    image: telebrief:${IMAGE_TAG:-dev}
    container_name: telebrief-authority-worker
    restart: unless-stopped
    stop_grace_period: 120s
    command: ["python", "-m", "src.worker", "--concurrency=2", "--queues=authority"]
    depends_on:
      postgres:
        condition: service_healthy
      telebrief-migrate:
        condition: service_completed_successfully
    env_file:
      - ${TELEBRIEF_ENV_FILE:-.env}
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=UTC
      - DATABASE_URL=postgresql://${POSTGRES_USER:-telebrief}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-telebrief}
      - DATABASE_MAX_POOL_SIZE=10
      - DATABASE_MIN_POOL_SIZE=1
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./logs:/app/logs
      - ./sessions:/app/sessions
      - ./data:/app/data
      - telebrief_auth:/var/lib/telebrief/auth
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: pgvector/pgvector:pg18
    container_name: telebrief-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telebrief}
      POSTGRES_USER: ${POSTGRES_USER:-telebrief}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql
    # This VM also runs Coolify and builds other sites, so keep PostgreSQL's
    # resident and per-query memory conservative until host metrics justify more.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "effective_cache_size=3GB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "autovacuum_work_mem=64MB"
      - "-c"
      - "temp_buffers=4MB"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "max_parallel_workers=0"
      - "-c"
      - "max_parallel_workers_per_gather=0"
      - "-c"
      - "jit=off"
      - "-c"
      - "autovacuum_max_workers=2"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-telebrief} -d ${POSTGRES_DB:-telebrief}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  telebrief_auth:
