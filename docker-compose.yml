services:
  telebrief-app:
    image: ghcr.io/djbob2000/telebrief:latest
    container_name: telebrief-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=UTC
      - DATABASE_URL=postgresql://${POSTGRES_USER:-telebrief}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-telebrief}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./logs:/app/logs
      - ./sessions:/app/sessions
      - ./data:/app/data
      - telebrief_auth:/var/lib/telebrief/auth
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import os, signal; os.kill(1, 0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  telebrief-worker:
    image: ghcr.io/djbob2000/telebrief:latest
    container_name: telebrief-worker
    restart: unless-stopped
    command: ["python", "-m", "src.worker", "--concurrency=2"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=UTC
      - DATABASE_URL=postgresql://${POSTGRES_USER:-telebrief}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-telebrief}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./logs:/app/logs
      - ./sessions:/app/sessions
      - ./data:/app/data
      - telebrief_auth:/var/lib/telebrief/auth
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: pgvector/pgvector:pg18
    container_name: telebrief-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telebrief}
      POSTGRES_USER: ${POSTGRES_USER:-telebrief}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=64MB"
      - "-c"
      - "effective_cache_size=256MB"
      - "-c"
      - "work_mem=2MB"
      - "-c"
      - "maintenance_work_mem=32MB"
      - "-c"
      - "autovacuum_work_mem=16MB"
      - "-c"
      - "temp_buffers=4MB"
      - "-c"
      - "max_connections=10"
      - "-c"
      - "max_parallel_workers=0"
      - "-c"
      - "max_parallel_workers_per_gather=0"
      - "-c"
      - "jit=off"
      - "-c"
      - "autovacuum_max_workers=1"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-telebrief} -d ${POSTGRES_DB:-telebrief}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  telebrief_auth:
