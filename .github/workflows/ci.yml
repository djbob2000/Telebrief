name: CI

on:
  push:
    branches: [main, custom]
  pull_request:
    branches: [ main, custom ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - name: Cache pre-commit hooks
      uses: actions/cache@v5
      with:
        path: ~/.cache/pre-commit
        key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pre-commit-

    - name: Install pre-commit
      run: |
        python -m pip install --upgrade pip
        pip install pre-commit

    - name: Run pre-commit hooks
      run: pre-commit run --all-files --show-diff-on-failure

  verify:
    name: Verify Python and Database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: telebrief
          POSTGRES_PASSWORD: password
          POSTGRES_DB: telebrief_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U telebrief -d telebrief_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://telebrief:password@localhost:5432/telebrief_test

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - name: Cache pip dependencies
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', 'pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Initialize Database Schema
      run: |
        python scripts/migrate.py
        python -c "import asyncio, os; from src.jobs.admin import ensure_official_tables; asyncio.run(ensure_official_tables(os.environ['DATABASE_URL'], 'procrastinate'))"

    - name: Show verification tool versions
      run: |
        python --version
        ruff --version
        mypy --version

    - name: Run static checks
      run: |
        ruff check src/
        ruff format --check src/
        mypy src/

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - name: Cache pre-commit hooks
      uses: actions/cache@v5
      with:
        path: ~/.cache/pre-commit
        key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pre-commit-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff safety==3.7.0

    - name: Run security checks (Ruff security rules)
      run: ruff check --select S src/

    - name: Run Safety (dependency security check)
      run: safety check --json

  website-build:
    name: Website Build Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: website/package-lock.json

    - name: Install website dependencies
      run: npm ci
      working-directory: website

    - name: Build website
      run: npm run build
      working-directory: website

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint, verify, security, website-build]

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: python -m build

    - name: Upload artifacts
      uses: actions/upload-artifact@v6
      with:
        name: dist
        path: dist/
