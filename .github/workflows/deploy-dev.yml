name: Publish Dev Image

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: publish-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Build and Publish Dev Image
    runs-on: ubuntu-latest

    steps:
      - name: Require dev branch for manual runs
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/dev" ]; then
            echo "Manual image publishing is allowed only from refs/heads/dev." >&2
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev
            type=raw,value=dev-${{ github.sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify dev image manifest platforms
        env:
          IMAGE_REPOSITORY: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          image_repository="$(printf '%s' "$IMAGE_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          image_ref="${image_repository}:dev"
          manifest_file="$RUNNER_TEMP/dev-image-index.json"
          docker buildx imagetools inspect "$image_ref" --raw > "$manifest_file"
          jq -e '
            [.manifests[]?.platform? | select(.os == "linux") | .architecture] as $architectures
            | ($architectures | index("amd64")) != null
              and ($architectures | index("arm64")) != null
          ' "$manifest_file" > /dev/null
          jq -r '[.manifests[]?.platform? | select(.os == "linux") | "\(.os)/\(.architecture)"] | unique | join(", ")' "$manifest_file"
