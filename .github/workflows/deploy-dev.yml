name: Deploy Dev to Server

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      tag:
        description: 'Specific image tag to deploy (default: dev)'
        required: false
        default: 'dev'

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    name: Verify, Build & Deploy Dev
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: telebrief
          POSTGRES_PASSWORD: password
          POSTGRES_DB: telebrief_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U telebrief -d telebrief_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://telebrief:password@localhost:5432/telebrief_test
      TELEBRIEF_TEST_DATABASE_URL: postgresql://telebrief:password@localhost:5432/telebrief_test
      OPENROUTER_API_KEY: sk-or-test-key
      OPENROUTER_MODEL: minimax/minimax-m3:free:floor
      OPENROUTER_MODEL_2: minimax/minimax-m2.7:free:floor
      OPENAI_API_KEY: sk-test-key
      OPENAI_MODEL: gpt-5-nano
      GEMINI_API_KEY: test-gemini-key
      ANTHROPIC_API_KEY: test-anthropic-key
      TELEGRAM_API_ID: "12345678"
      TELEGRAM_API_HASH: test_hash
      TELEGRAM_BOT_TOKEN: 123456789:ABC-DEF
      TARGET_CHAT_ID: "@test_chat"
      TELEGRAM_TARGET_CHAT_ID: "@test_chat"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt safety==3.7.0

      - name: Show test tool versions
        run: |
          python --version
          python -m pytest --version

      - name: Run pre-commit checks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Run dependency security check
        run: safety check --json

      - name: Initialize Database Schema
        run: python scripts/migrate.py

      - name: Run Pytest
        run: |
          set -o pipefail
          python -m pytest --cov=src --cov-report=term-missing 2>&1 | tee /tmp/pytest.log

      - name: Upload Test Failure Log to Server
        if: failure()
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          WORK_DIR: ${{ secrets.WORK_DIR }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          if [ -f /tmp/pytest.log ]; then
            scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new /tmp/pytest.log "$SSH_USER@$SSH_HOST:$WORK_DIR/logs/ci_failure.log" || true
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev
            type=raw,value=dev-${{ github.sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Copy deployment files to server
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          WORK_DIR: ${{ secrets.WORK_DIR }}
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new docker-compose.yml config.yaml "$SSH_USER@$SSH_HOST:$WORK_DIR/"

      - name: Execute Remote Deployment
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          WORK_DIR: ${{ secrets.WORK_DIR }}
          DEPLOY_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' && github.event.inputs.tag || format('dev-{0}', github.sha) }}
        run: |
          CONFIG_SHA256="$(sha256sum config.yaml | awk '{print $1}')"
          EXPECTED_BACKGROUND_AUTHORITY="$(awk -F': *' '$1 ~ /^[[:space:]]*background_authority_enabled[[:space:]]*$/ {print $2; exit}' config.yaml)"
          EXPECTED_AUTHORITY_SHARDS="$(awk -F': *' '$1 ~ /^[[:space:]]*authority_shard_count[[:space:]]*$/ {print $2; exit}' config.yaml)"
          test -n "$CONFIG_SHA256"
          test -n "$EXPECTED_BACKGROUND_AUTHORITY"
          test -n "$EXPECTED_AUTHORITY_SHARDS"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" "WORK_DIR=\"$WORK_DIR\" DEPLOY_TAG=\"$DEPLOY_TAG\" GITHUB_REPOSITORY=\"$GITHUB_REPOSITORY\" GITHUB_SHA=\"$GITHUB_SHA\" CONFIG_SHA256=\"$CONFIG_SHA256\" EXPECTED_BACKGROUND_AUTHORITY=\"$EXPECTED_BACKGROUND_AUTHORITY\" EXPECTED_AUTHORITY_SHARDS=\"$EXPECTED_AUTHORITY_SHARDS\" bash -s" << 'EOF'
            set -euo pipefail
            cd "$WORK_DIR"
            export IMAGE_TAG="$DEPLOY_TAG"
            echo "==> Deploying Telebrief with IMAGE_TAG=${IMAGE_TAG}..."

            # docker-compose.yml bind-mounts this file into every container;
            # verify the copied host file before recreating services.
            host_config_sha256="$(sha256sum config.yaml | awk '{print $1}')"
            test "$host_config_sha256" = "$CONFIG_SHA256"

            repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
            image_ref="ghcr.io/${repository}:${IMAGE_TAG}"

            # Stop legacy single-container telebrief if running
            docker stop telebrief 2>/dev/null || true

            # Pull latest images
            echo "==> Pulling images..."
            docker compose pull telebrief-app telebrief-worker telebrief-processing-worker telebrief-authority-worker

            # Keep the moving dev alias fresh as well as the immutable SHA tag.
            # This makes ad-hoc `docker compose run` commands use the same
            # revision as the long-running services after a dev deployment.
            if [[ "$IMAGE_TAG" == dev-* ]]; then
              echo "==> Refreshing the dev image alias..."
              docker pull "ghcr.io/${repository}:dev"
              dev_revision="$(docker image inspect "ghcr.io/${repository}:dev" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
              test "$dev_revision" = "${IMAGE_TAG#dev-}"
            fi

            # Migration 0034 changes ownership semantics for legacy running
            # revisions. Quiesce the processing owner before expiring those
            # leases so an old worker cannot continue side effects while a new
            # worker reclaims the same revision.
            echo "==> Stopping processing worker before ownership migration..."
            docker compose stop telebrief-processing-worker telebrief-authority-worker

            # Run database migrations
            echo "==> Running database migrations..."
            migration_output="$(docker compose run --rm --interactive=false -T telebrief-app python scripts/migrate.py </dev/null)"
            printf '%s\n' "$migration_output"
            applied_schema="$(printf '%s\n' "$migration_output" | awk '/^schema version: / {print $3}')"
            test -n "$applied_schema"

            # Start all services with force recreate for application containers
            echo "==> Starting services with force recreate..."
            docker compose up -d --force-recreate --no-deps telebrief-app telebrief-worker telebrief-processing-worker telebrief-authority-worker
            docker compose up -d --remove-orphans

            # Verify that every application container uses the exact image
            # revision that was pulled and that the image supports the DB schema.
            expected_revision="$(docker image inspect "$image_ref" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
            test -n "$expected_revision"
            if [[ "$IMAGE_TAG" == dev-* ]]; then
              test "$expected_revision" = "${IMAGE_TAG#dev-}"
            fi
            for service in telebrief-app telebrief-worker telebrief-processing-worker telebrief-authority-worker; do
              container_id="$(docker compose ps -q "$service")"
              test -n "$container_id"
              container_status="$(docker inspect "$container_id" --format '{{.State.Status}}')"
              container_revision="$(docker inspect "$container_id" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
              test "$container_status" = "running"
              test "$container_revision" = "$expected_revision"
            done
            container_config_sha256="$(docker compose exec -T telebrief-app sha256sum /app/config.yaml | awk '{print $1}')"
            test "$container_config_sha256" = "$CONFIG_SHA256"
            runtime_authority_config="$(docker compose exec -T telebrief-app python -c 'from src.config_loader import load_config; c=load_config(); print(str(c.settings.event_pipeline.background_authority_enabled).lower(), c.settings.event_pipeline.authority_shard_count)' </dev/null)"
            expected_authority_config="${EXPECTED_BACKGROUND_AUTHORITY,,} $EXPECTED_AUTHORITY_SHARDS"
            echo "==> Runtime authority config: ${runtime_authority_config}"
            test "$runtime_authority_config" = "$expected_authority_config"
            runtime_schema="$(docker compose run --rm --interactive=false -T --no-deps telebrief-app python -c 'from src.bootstrap import SCHEMA_VERSION_MAXIMUM; print(SCHEMA_VERSION_MAXIMUM)' </dev/null)"
            test "$runtime_schema" = "$applied_schema"

            # Clean up old unused images to save disk space
            echo "==> Pruning dangling images..."
            docker image prune -f

            # Display running containers
            echo "==> Current container status:"
            docker compose ps
          EOF
