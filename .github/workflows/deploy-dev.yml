name: Deploy Dev to Server

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      tag:
        description: 'Specific image tag to deploy (default: dev)'
        required: false
        default: 'dev'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.tag == 'dev' || github.event.inputs.tag == ''
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: telebrief
          POSTGRES_PASSWORD: password
          POSTGRES_DB: telebrief_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U telebrief -d telebrief_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://telebrief:password@localhost:5432/telebrief_test
      TELEBRIEF_TEST_DATABASE_URL: postgresql://telebrief:password@localhost:5432/telebrief_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff Lint
        run: ruff check src/ tests/

      - name: Initialize Database Schema
        run: python scripts/migrate.py

      - name: Run Pytest
        run: pytest -v

  build-and-push:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.tag == 'dev' || github.event.inputs.tag == ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev
            type=raw,value=dev-${{ github.sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server via SSH
    needs: [build-and-push]
    runs-on: ubuntu-latest
    if: |
      always() &&
      (
        needs.build-and-push.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != 'dev' && github.event.inputs.tag != '')
      )
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Copy docker-compose.yml to server
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          WORK_DIR: ${{ secrets.WORK_DIR }}
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new docker-compose.yml "$SSH_USER@$SSH_HOST:$WORK_DIR/docker-compose.yml"

      - name: Execute Remote Deployment
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          WORK_DIR: ${{ secrets.WORK_DIR }}
          DEPLOY_TAG: ${{ github.event.inputs.tag || 'dev' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" "WORK_DIR=\"$WORK_DIR\" DEPLOY_TAG=\"$DEPLOY_TAG\" bash -s" << 'EOF'
            set -euo pipefail
            cd "$WORK_DIR"
            export IMAGE_TAG="$DEPLOY_TAG"
            echo "==> Deploying Telebrief with IMAGE_TAG=${IMAGE_TAG}..."

            # Stop legacy single-container telebrief if running
            docker stop telebrief 2>/dev/null || true

            # Pull latest images
            echo "==> Pulling images..."
            docker compose pull

            # Run database migrations
            echo "==> Running database migrations..."
            docker compose run --rm telebrief-app python scripts/migrate.py

            # Start all services and clean up obsolete containers
            echo "==> Starting services..."
            docker compose up -d --remove-orphans

            # Display running containers
            echo "==> Current container status:"
            docker compose ps
          EOF
