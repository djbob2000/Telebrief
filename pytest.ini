[pytest]
# Pytest configuration

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Default options: fast parallel execution across CPU cores
addopts =
    --verbose
    --asyncio-mode=auto
    --timeout=300
    -n auto

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    requires_credentials: Tests requiring API credentials
    postgres: Tests requiring a live PostgreSQL test database

# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
