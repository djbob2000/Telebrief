<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 960" width="100%" height="100%" style="background:#0a0e1a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="50%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#090d18"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162035" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="glowBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="glowPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glowGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="glowAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="glowRose" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- Decorative Grid / Glows -->
  <circle cx="200" cy="150" r="180" fill="#38bdf8" opacity="0.04" filter="blur(60px)"/>
  <circle cx="950" cy="500" r="220" fill="#6366f1" opacity="0.04" filter="blur(80px)"/>
  <circle cx="640" cy="800" r="250" fill="#10b981" opacity="0.04" filter="blur(80px)"/>

  <!-- Header -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="38" height="38" rx="8" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="19" y="25" fill="#38bdf8" font-size="20" font-weight="bold" text-anchor="middle">⚡</text>
    <text x="50" y="24" fill="#ffffff" font-size="24" font-weight="800" letter-spacing="-0.5">Telebrief · Event-First Архитектура</text>
    <text x="50" y="44" fill="#94a3b8" font-size="13">Как сырые сообщения Telegram превращаются в достоверный Дайджест и Статью без галлюцинаций</text>
  </g>

  <!-- ==================== STAGE 1: INGESTION ==================== -->
  <g transform="translate(60, 120)">
    <rect width="320" height="210" rx="16" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="20" y="16" width="90" height="24" rx="6" fill="#38bdf8" fill-opacity="0.15"/>
    <text x="65" y="32" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">1. INGESTION</text>

    <text x="20" y="65" fill="#ffffff" font-size="16" font-weight="700">Сбор и детекция</text>
    <text x="20" y="85" fill="#94a3b8" font-size="12">Telegram-каналы, группы, чаты</text>

    <!-- Source Items Pill -->
    <g transform="translate(20, 105)">
      <rect width="280" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <circle cx="20" cy="21" r="5" fill="#38bdf8"/>
      <text x="35" y="25" fill="#cbd5e1" font-size="12" font-weight="600">~1 000 – 3 000 сообщений/сутки</text>
    </g>

    <!-- Subtext -->
    <g transform="translate(20, 158)">
      <rect width="280" height="36" rx="8" fill="#0f172a" fill-opacity="0.6"/>
      <text x="12" y="22" fill="#64748b" font-size="11">Детерминированная разбивка на фрагменты</text>
    </g>
  </g>

  <!-- Connector 1 -> 2 -->
  <path d="M 380 225 L 440 225" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="410" y="215" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="middle">текст</text>

  <!-- ==================== STAGE 2: EMBEDDINGS & CLUSTERING ==================== -->
  <g transform="translate(450, 120)">
    <rect width="360" height="210" rx="16" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="20" y="16" width="130" height="24" rx="6" fill="#818cf8" fill-opacity="0.15"/>
    <text x="85" y="32" fill="#818cf8" font-size="11" font-weight="700" text-anchor="middle">2. MATH CLUSTERING</text>

    <text x="20" y="65" fill="#ffffff" font-size="16" font-weight="700">Векторная кластеризация</text>
    <text x="20" y="85" fill="#94a3b8" font-size="12">Разделение по смыслу БЕЗ языковой модели</text>

    <!-- Model info -->
    <g transform="translate(20, 105)">
      <rect width="320" height="42" rx="8" fill="#0f172a" stroke="#4338ca" stroke-width="1"/>
      <text x="14" y="20" fill="#a5b4fc" font-size="11" font-weight="700">Qwen3-Embedding-8B (1536 dimensions)</text>
      <text x="14" y="34" fill="#64748b" font-size="10">Косинусное сходство &gt; 0.72 объединяет посты в Story</text>
    </g>

    <g transform="translate(20, 158)">
      <rect width="320" height="36" rx="8" fill="#1e1b4b" fill-opacity="0.5"/>
      <text x="12" y="22" fill="#c7d2fe" font-size="11">🛡 Шутки и флуд математически отделены от аварий</text>
    </g>
  </g>

  <!-- Connector 2 -> 3 -->
  <path d="M 810 225 L 870 225" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="840" y="215" fill="#818cf8" font-size="10" font-weight="600" text-anchor="middle">Story</text>

  <!-- ==================== STAGE 3: GATE V2 TRIAGE (BATCH 64) ==================== -->
  <g transform="translate(880, 120)">
    <rect width="340" height="210" rx="16" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="20" y="16" width="120" height="24" rx="6" fill="#fbbf24" fill-opacity="0.15"/>
    <text x="80" y="32" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">3. GATE V2 TRIAGE</text>

    <text x="20" y="65" fill="#ffffff" font-size="16" font-weight="700">Шлюз отсева и привязки</text>
    <text x="20" y="85" fill="#fde68a" font-size="12" font-weight="600">⚡️ БАТЧ ПО 64 СЮЖЕТА РАЗОМ</text>

    <g transform="translate(20, 105)">
      <rect width="300" height="42" rx="8" fill="#0f172a" stroke="#b45309" stroke-width="1"/>
      <text x="14" y="20" fill="#fef3c7" font-size="11" font-weight="700">1 запрос в LLM ≈ 15 000 токенов</text>
      <text x="14" y="34" fill="#94a3b8" font-size="10">Отсев спама, гео-фильтр, классификация</text>
    </g>

    <g transform="translate(20, 158)">
      <rect width="300" height="36" rx="8" fill="#292524" fill-opacity="0.6"/>
      <text x="12" y="22" fill="#fbbf24" font-size="11">Решает: DROP / BRIEF / ANALYZE</text>
    </g>
  </g>

  <!-- Branching Arrows from Gate V2 -->
  <!-- Branch 1: DROP -->
  <path d="M 1050 330 L 1050 400 L 1180 400" fill="none" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrowRose)"/>
  <rect x="1100" y="375" width="130" height="50" rx="8" fill="#2a1215" stroke="#881337" stroke-width="1"/>
  <text x="1165" y="396" fill="#fda4af" font-size="11" font-weight="700" text-anchor="middle">❌ DROP / SPAM</text>
  <text x="1165" y="412" fill="#9f1239" font-size="9" text-anchor="middle">Реклама, цены, флуд</text>

  <!-- Branch 2: BRIEF -->
  <path d="M 980 330 L 980 570 L 830 570" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <rect x="850" y="545" width="160" height="50" rx="8" fill="#062e24" stroke="#065f46" stroke-width="1"/>
  <text x="930" y="566" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">🟢 BRIEF (90% тем)</text>
  <text x="930" y="582" fill="#047857" font-size="9" text-anchor="middle">Без доп. вызовов в LLM!</text>

  <!-- Branch 3: ANALYZE -->
  <path d="M 920 330 L 920 440 L 640 440 L 640 480" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="780" y="430" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">⚡️ Только резонансные темы (ANALYZE: ~5-10%)</text>

  <!-- ==================== STAGE 4: RICH EVENT ANALYSIS ==================== -->
  <g transform="translate(180, 490)">
    <rect width="640" height="175" rx="16" fill="url(#cardGrad)" stroke="#eab308" stroke-width="2" filter="url(#shadow)"/>
    <rect x="24" y="16" width="190" height="26" rx="6" fill="#eab308" fill-opacity="0.15"/>
    <text x="119" y="33" fill="#fde047" font-size="11" font-weight="800" text-anchor="middle">4. RICH EVENT ANALYSIS</text>

    <text x="24" y="68" fill="#ffffff" font-size="18" font-weight="800">Поштучный глубокий фактчекинг события</text>
    <text x="24" y="90" fill="#facc15" font-size="12" font-weight="600">🎯 ТОТ САМЫЙ ТОЧЕЧНЫЙ ВЫЗОВ (в OpenRouter: ~500 токенов in / ~200 out)</text>

    <!-- Details Box -->
    <g transform="translate(24, 105)">
      <rect width="592" height="52" rx="8" fill="#0f172a" stroke="#854d0e" stroke-width="1"/>
      <text x="16" y="22" fill="#cbd5e1" font-size="11" font-weight="600">• Вход: строго 2–4 сообщения, относящиеся именно к этому происшествию</text>
      <text x="16" y="40" fill="#a3e635" font-size="11" font-weight="700">• Выход: JSON со статусом ЖКХ (service_state: свет, вода, газ, авария/график)</text>
    </g>
  </g>

  <!-- Connector 4 -> 5 and BRIEF -> 5 -->
  <path d="M 500 665 L 500 730" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 850 595 L 750 730" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- ==================== STAGE 5: FINAL PUBLICATIONS ==================== -->
  <g transform="translate(60, 740)">
    <rect width="1160" height="180" rx="16" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>

    <!-- Title Area -->
    <rect x="24" y="16" width="180" height="24" rx="6" fill="#38bdf8" fill-opacity="0.15"/>
    <text x="114" y="32" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">5. PUBLICATION ENGINE</text>
    <text x="220" y="33" fill="#94a3b8" font-size="13">Selection AI отбирает темы без потери фактов и передает в генераторы</text>

    <!-- Publication 1: DIGEST -->
    <g transform="translate(24, 55)">
      <rect width="540" height="105" rx="12" fill="#0c1a2e" stroke="#1d4ed8" stroke-width="1"/>
      <rect x="16" y="14" width="28" height="28" rx="6" fill="#2563eb" fill-opacity="0.2"/>
      <text x="30" y="33" fill="#60a5fa" font-size="16" text-anchor="middle">📌</text>
      <text x="54" y="32" fill="#ffffff" font-size="15" font-weight="700">Городской дайджест (Digest Grouped)</text>
      <text x="54" y="50" fill="#93c5fd" font-size="11">Для быстрого чтения за 30 секунд</text>

      <line x1="16" y1="62" x2="524" y2="62" stroke="#1e293b" stroke-width="1"/>

      <text x="16" y="80" fill="#cbd5e1" font-size="11">• <tspan fill="#34d399" font-weight="700">City Situation</tspan>: детерминированный монитор ЖКХ (свет, вода, связь)</text>
      <text x="16" y="96" fill="#cbd5e1" font-size="11">• Рубрики с фактами + 4-уровневая статистика проверенных сообщений</text>
    </g>

    <!-- Publication 2: ARTICLE -->
    <g transform="translate(596, 55)">
      <rect width="540" height="105" rx="12" fill="#1e1338" stroke="#7e22ce" stroke-width="1"/>
      <rect x="16" y="14" width="28" height="28" rx="6" fill="#9333ea" fill-opacity="0.2"/>
      <text x="30" y="33" fill="#c084fc" font-size="16" text-anchor="middle">📰</text>
      <text x="54" y="32" fill="#ffffff" font-size="15" font-weight="700">Хроника городской жизни (Long-Read Article)</text>
      <text x="54" y="50" fill="#d8b4fe" font-size="11">Полноценная журналистская статья за 24 часа</text>

      <line x1="16" y1="62" x2="524" y2="62" stroke="#1e293b" stroke-width="1"/>

      <text x="16" y="80" fill="#cbd5e1" font-size="11">• Иерархия: <tspan fill="#e879f9" font-weight="700">DEVELOP</tspan> (главные темы), <tspan fill="#818cf8" font-weight="700">WEAVE</tspan> (жизнь города), <tspan fill="#34d399" font-weight="700">BRIEF</tspan> (детали)</text>
      <text x="16" y="96" fill="#cbd5e1" font-size="11">• 100% покрытие отобранных фактов без галлюцинаций Evidence Boundary</text>
    </g>
  </g>
</svg>
